<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>지뢰찾기</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="game">
    <header class="game-header">
      <div>
        <p class="eyebrow">CLASSIC MINESWEEPER</p>
        <h1>💣 지뢰찾기</h1>
      </div>
      <button id="restart-button" class="restart-button" type="button" aria-label="새 게임 시작">🙂</button>
    </header>

    <section class="status-panel" aria-label="게임 상태">
      <div class="status-item">
        <span class="status-label">남은 지뢰</span>
        <strong id="mine-counter">10</strong>
      </div>
      <div id="game-message" class="game-message" role="status" aria-live="polite">첫 칸을 열어 게임을 시작하세요.</div>
      <div class="status-item status-item-right">
        <span class="status-label">시간</span>
        <strong><span id="timer">0</span>초</strong>
      </div>
    </section>

    <div id="game-board" class="game-board" role="grid" aria-label="9x9 지뢰찾기 게임 보드"></div>
    <p class="help-text">좌클릭: 칸 열기 · 우클릭: 깃발 꽂기/해제</p>
  </main>
</body>
</html>
